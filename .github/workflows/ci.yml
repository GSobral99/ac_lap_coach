name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Only analyser.py, recorder.py's non-live functions, tracks.py and
    # parse_ai_spline.py are tested here
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v
